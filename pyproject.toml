[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "go-bpe"
version = "0.1.0"
description = "BPE tokenizer implemented in Go with Python bindings"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
go_bpe = ["*.so", "*.dylib"]
